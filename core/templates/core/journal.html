{% extends 'core/base.html' %} {% block content %}

<div class="max-w-3xl mx-auto p-6 text-white">
    <div class="mb-8 border-b border-gray-700 pb-4">
        <h1 class="text-2xl font-bold tracking-tight"> Diario</h1>
        <p class="text-gray-400 mt-1">{{ entry.date|date:"l, d \d\e F Y" }}</p>
    </div>

    <form method="POST" action="{% url 'save_journal' %}" class="space-y-6">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">Reflexión del día</label>
            <textarea name="reflection" rows="5" class="w-full bg-gray-800/50 border border-gray-700 rounded-lg p-4 text-white placeholder-gray-500 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition">{{ entry.reflection }}</textarea>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2"> Qué salió bien</label>
                <textarea name="went_well" rows="4" class="w-full bg-gray-800/50 border border-gray-700 rounded-lg p-4 text-white placeholder-gray-500 focus:border-green-500 focus:ring-1 focus:ring-green-500 outline-none transition">{{ entry.went_well }}</textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2"> Qué mejorar</label>
                <textarea name="to_improve" rows="4" class="w-full bg-gray-800/50 border border-gray-700 rounded-lg p-4 text-white placeholder-gray-500 focus:border-orange-500 focus:ring-1 focus:ring-orange-500 outline-none transition">{{ entry.to_improve }}</textarea>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-300 mb-2"> Notas rápidas</label>
            <textarea name="quick_notes" rows="3" class="w-full bg-gray-800/50 border border-gray-700 rounded-lg p-4 text-white placeholder-gray-500 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition" placeholder="Ideas sueltas, cosas por hacer mañana...">{{ entry.quick_notes }}</textarea>
        </div>

         <div>
            <label class="block text-sm font-medium text-gray-300 mb-2"> Enlace adjunto (Opcional)</label>
            <input type="url" name="links" value="{{ entry.links }}" class="w-full bg-gray-800/50 border border-gray-700 rounded-lg p-4 text-white placeholder-gray-500 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition" placeholder="https://...">
        </div>

        <div class="pt-4 flex justify-end">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition duration-200 shadow-lg shadow-blue-600/20">
                Guardar Entrada
            </button>
        </div>
    </form>
</div>

{% endblock %}
