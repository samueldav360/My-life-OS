<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - My Life OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        form p { margin-bottom: 1rem; color: #9ca3af; font-size: 0.875rem; }
        form label { display: block; margin-bottom: 0.375rem; color: #9ca3af; font-weight: 500; margin-left: 0.25rem; }
        form input { width: 100%; background-color: #0d0f12; border: 1px solid #1f2937; color: white; border-radius: 0.75rem; padding: 0.75rem 1rem; margin-bottom: 0.5rem; outline: none; }
        form input:focus { border-color: #3b82f6; }
        .helptext { font-size: 0.75rem; color: #6b7280; display: block; margin-top: 0.25rem; }
        ul.errorlist { color: #ef4444; font-size: 0.875rem; margin-bottom: 1rem; list-style-type: disc; padding-left: 1.5rem; }
    </style>
</head>
<body class="bg-[#0d0f12] text-white min-h-screen flex items-center justify-center font-sans py-10">
    
    <div class="bg-[#111318] border border-gray-800 p-8 rounded-3xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-wider mb-2">Crear Cuenta</h1>
            <p class="text-gray-500 text-sm">Únete y configura tu sistema operativo</p>
        </div>
        
        <form method="POST" class="space-y-2">
            {% csrf_token %}
            
            {{ form.as_p }}
            
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition duration-200 mt-6 shadow-lg shadow-blue-900/20">
                Registrarse
            </button>
            
            <p class="text-center text-gray-500 text-sm mt-6">
                ¿Ya tienes una cuenta? 
                <a href="{% url 'login' %}" class="text-blue-500 hover:text-blue-400 font-medium transition">Inicia sesión</a>
            </p>
        </form>
    </div>

</body>
</html>
